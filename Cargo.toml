[package]
name = "combicode"
version = "4.0.0"
edition = "2024"
rust-version = "1.88"
description = "Pack a codebase into one LLM-friendly text file with a code map and exact line references"
authors = ["A. Aurelions"]
license = "MIT"
repository = "https://github.com/aaurelions/combicode"
homepage = "https://github.com/aaurelions/combicode"
readme = "README.md"
keywords = ["llm", "context", "prompt", "cli", "codebase"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
ignore = "0.4.30"
regex = "1.13.1"
same-file = "1.0.6"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
